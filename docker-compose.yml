version: '3.8'

services:
  api:
    build: .
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=minioadmin
      - MinIO__SecretKey=minioadmin
      - MinIO__BucketName=videos
      - MinIO__UseSSL=false
      - MinIO__PublicEndpoint=http://your-domain.com/storage
    depends_on:
      - minio
    networks:
      - app-network

  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
      - minio
    networks:
      - app-network

volumes:
  minio_data:

networks:
  app-network:
    driver: bridge